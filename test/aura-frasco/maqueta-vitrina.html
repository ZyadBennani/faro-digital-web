<!doctype html>
<html lang="es" data-superficie="papel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Maqueta · la vitrina de Aura sobre papel</title>
<link rel="stylesheet" href="../../assets/base.css">
<link rel="stylesheet" href="../../assets/motion.css">
<style>
  /* ── LA VITRINA NUEVA, EN UNA FRASE ──────────────────────────────────────
     Tres frascos nitidos, en linea, sobre papel, y el que eliges se acerca.

     Lo que NO hay, y cada ausencia es una correccion del diagnostico del 17-sep:
       · ni caja ni fondo propio: la seccion no tiene borde. Los frascos estan
         SOBRE la pagina, no DENTRO de un cuadro negro.
       · ni desenfoque ni halo de movimiento: los tres estan enfocados. Lo que
         el ojo leia como profundidad lo leia como error de carga.
       · ni pedestal acanalado. Nadie lo pidio y competia con el producto.
       · ni dorado de plastico. El unico acento es el de Aura, #916445, y solo
         en el precio y en el aro del tapon.
       · ni «TOCA UN PRODUCTO PARA VERLO DE CERCA». Si hay que explicar la
         interaccion, la interaccion no se entiende.
       · ni panel de precios negro. La lista va en tinta sobre papel, con la
         tipografia del sitio y una linea fina entre productos.
       · ni boton marron con sombra. El boton es el de base.css.
     ---------------------------------------------------------------------- */
  body{ margin:0; background:var(--f-fondo); color:var(--f-tinta);
        font-family:var(--f-familia-texto); font-size:var(--f-cuerpo); }

  .seccion{ max-width:var(--e-pagina-max); margin:0 auto; padding:0 var(--e-margen); }
  .vitrina{ display:grid; grid-template-columns:1fr 316px; gap:var(--e-xl);
            align-items:center; }

  /* El estante: sin fondo, sin borde, sin sombra de caja. El papel del render
     ES el papel de la pagina, asi que no hay costura que disimular. */
  .estante{ position:relative; }
  .estante img{ display:block; width:100%; height:auto; }

  .carta{ list-style:none; margin:0; padding:0; }
  .carta li + li{ border-top:1px solid var(--f-linea); }
  .fila{ width:100%; display:grid; grid-template-columns:1fr auto; gap:4px 16px;
         align-items:baseline; padding:16px 0; background:none; border:0;
         text-align:left; cursor:pointer; color:inherit; font:inherit;
         transition:opacity var(--m-rapido) var(--m-estandar); }
  /* 🔴 CADA CELDA CON SU FILA Y SU COLUMNA ESCRITAS. Con solo `grid-row` en el
     precio, la colocacion automatica lo metio en la columna 1 y empujo el nombre
     a la 2: la lista salia «39 € ... VELO», con el precio a la izquierda. Se ve
     en la primera maqueta del 17-sep. En una rejilla, media posicion escrita es
     peor que ninguna: el navegador completa la otra mitad donde le cabe. */
  .f-nom{ grid-column:1; grid-row:1;
          font-family:var(--f-familia-display); font-weight:var(--f-peso-display);
          font-size:1.18rem; letter-spacing:-.01em; }
  .f-det{ grid-column:1; grid-row:2; font-size:var(--f-sello); letter-spacing:var(--f-sello-track);
          text-transform:uppercase; color:var(--f-suave); }
  .f-eur{ grid-column:2; grid-row:1 / span 2; align-self:center; justify-self:end;
          font-family:var(--f-familia-display); font-size:1.18rem; font-weight:600;
          color:#916445; font-variant-numeric:tabular-nums; }

  /* Seleccionado: el producto y su fila se encienden A LA VEZ. Es la misma
     seleccion, no dos. Y los no elegidos bajan de PRESENCIA, no de opacidad:
     un producto medio transparente se lee como un fallo, no como un estado. */
  .carta[data-sel] .fila{ opacity:.52; }
  .carta[data-sel] .fila[aria-current]{ opacity:1; }
  .carta[data-sel] .fila[aria-current] .f-nom{ text-decoration:underline;
        text-decoration-color:#916445; text-underline-offset:6px;
        text-decoration-thickness:1.5px; }

  .pie{ display:flex; align-items:center; justify-content:space-between;
        gap:20px; margin-top:var(--e-l); flex-wrap:wrap; }
  .nota{ font-size:var(--f-sello); letter-spacing:var(--f-sello-track);
         text-transform:uppercase; color:var(--f-suave); }
  /* Un solo boton, el de base.css, sin sombra. */
  .btn{ font-family:var(--f-familia-texto); font-size:var(--f-sello);
        letter-spacing:var(--f-sello-track); text-transform:uppercase; font-weight:600;
        padding:12px 22px; border:0; border-radius:100px; cursor:pointer;
        background:#916445; color:#FFF8F2;
        transition:background var(--m-rapido) var(--m-estandar); }
  .btn:hover{ background:var(--f-tinta); }

  .rotulo{ font-family:var(--f-familia-display); font-weight:var(--f-peso-display);
           font-size:var(--f-cifra); letter-spacing:-.01em; margin:0 0 6px; }
  .sello{ font-size:var(--f-sello); letter-spacing:var(--f-sello-track);
          text-transform:uppercase; color:var(--f-suave); margin:0 0 var(--e-l); }

  @media (max-width:820px){
    .vitrina{ grid-template-columns:1fr; gap:var(--e-m, 28px); }
    .pie{ margin-top:var(--e-m, 28px); }
    .btn{ width:100%; }
  }
</style>
</head>
<body>
<div class="seccion" id="seccion">
  <p class="sello">02 · La tienda</p>
  <h2 class="rotulo">Toda la carta, con el precio delante</h2>

  <div class="vitrina">
    <div class="estante">
      <img id="estante" src="../../Renders/aura-s1/vitrina-reposo.png" width="1440" height="900"
           alt="Los tres productos de Aura en linea sobre papel: VELO, ALBA y ROCIO">
    </div>

    <ul class="carta" id="carta">
      <li><button class="fila" data-p="crema"><span class="f-nom">VELO</span><span class="f-det">Crema · 50 ml</span><span class="f-eur">39 €</span></button></li>
      <li><button class="fila" data-p="serum"><span class="f-nom">ALBA</span><span class="f-det">Sérum · 30 ml</span><span class="f-eur">48 €</span></button></li>
      <li><button class="fila" data-p="bruma"><span class="f-nom">ROCÍO</span><span class="f-det">Bruma · 100 ml</span><span class="f-eur">32 €</span></button></li>
    </ul>
  </div>

  <div class="pie">
    <span class="nota">Envío gratis a partir de 40 €</span>
    <button class="btn">Añadir a la bolsa</button>
  </div>
</div>

<script>
/* La maqueta es ESTATICA a proposito: en la sesion 1 se aprueba la composicion,
   no el codigo en vivo. Este puñado de lineas solo sirve para poder fotografiar
   los dos estados. La transicion de verdad —600 ms, una sola curva, 12 % de
   escala y 15 grados— se construye en la sesion 2, con three.js. */
const carta = document.getElementById('carta');
const estante = document.getElementById('estante');
window.ponerEstado = function (id) {
  if (id) { carta.dataset.sel = id; } else { delete carta.dataset.sel; }
  carta.querySelectorAll('.fila').forEach(f => {
    if (f.dataset.p === id) f.setAttribute('aria-current', 'true');
    else f.removeAttribute('aria-current');
  });
  estante.src = id === 'serum'
    ? '../../Renders/aura-s1/vitrina-serum.png'
    : '../../Renders/aura-s1/vitrina-reposo.png';
  return new Promise(r => { estante.complete ? r(true) : estante.addEventListener('load', () => r(true), { once: true }); });
};
carta.querySelectorAll('.fila').forEach(f =>
  f.addEventListener('click', () => window.ponerEstado(f.dataset.p)));
</script>
</body>
</html>
